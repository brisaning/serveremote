name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt (formato)
        run: cargo fmt --check
      - name: clippy (avisos como errores)
        run: cargo clippy --all-targets -- -D warnings
      - name: tests
        run: cargo test

  docker:
    name: Docker (build de la imagen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build imagen
        run: docker build -t serveremote:ci .
