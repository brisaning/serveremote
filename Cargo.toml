[package]
# El paquete se llama `serveremote` (repo homónimo); anyremote lo consume con
# el alias `anyremote-rendezvous = { package = "serveremote", git = … }` —
# así el código del daemon no cambia y el protocolo vive en UNA sola fuente.
name = "serveremote"
# Versión alineada a la release de anyremote que lo trajo (compatibilidad del
# protocolo `anyremote-rdv-v1`); los hotfix propios suben el patch.
version = "0.12.0"
edition = "2021"
license = "Apache-2.0"
description = "Servidor de encuentro (rendezvous) + relay de anyremote — protocolo anyremote-rdv-v1"
repository = "https://github.com/brisaning/serveremote"

[dependencies]
# Verificación de identidad (copia verbatim de `core/identity` de anyremote —
# el transcript de firma debe ser BYTE-IDÉNTICO al de los clientes).
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
data-encoding = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"

[[bin]]
name = "serveremote"
path = "src/main.rs"
